name: Release

# Push a tag like v1.2.2 and this builds the signed APK and publishes the GitHub release.
# Needs four repository secrets (Settings > Secrets and variables > Actions):
#   CLAWD_KEYSTORE_BASE64   the release keystore file, base64-encoded
#   CLAWD_KEYSTORE_PASSWORD, CLAWD_KEY_ALIAS, CLAWD_KEY_PASSWORD
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, e.g. v1.2.2 (must already exist)
        required: true

permissions:
  contents: write

env:
  # The certificate every Pinch release is signed with. An APK signed with any other key
  # will not install over the app people have, so the release stops here instead.
  CERT_SHA256: 39d7530a8c27d9c90ab535a97cf28c40d1bce65dea88a7bc58946326776cdd52

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        run: echo "TAG=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      # Refuse a tampered gradle-wrapper.jar before running anything.
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Check the version matches the tag
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "v$name" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match versionName $name in app/build.gradle.kts"
            exit 1
          fi
          echo "VERSION=$name" >> "$GITHUB_ENV"

      - name: Restore the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CLAWD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The CLAWD_KEYSTORE_BASE64 secret is not set. See the top of release.yml."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CLAWD_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build the signed APK
        env:
          CLAWD_KEYSTORE_PASSWORD: ${{ secrets.CLAWD_KEYSTORE_PASSWORD }}
          CLAWD_KEY_ALIAS: ${{ secrets.CLAWD_KEY_ALIAS }}
          CLAWD_KEY_PASSWORD: ${{ secrets.CLAWD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Check the signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          signer=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          cert=$("$signer" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          if [ "$cert" != "$CERT_SHA256" ]; then
            echo "::error::Signed with $cert, not the Pinch release key. People could not update to it."
            exit 1
          fi
          cp "$apk" "pinch-$VERSION.apk"
          rm -f "$CLAWD_KEYSTORE"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="pinch-$VERSION.apk"
          sum=$(sha256sum "$apk" | cut -d' ' -f1)
          cert=$(echo "$CERT_SHA256" | tr a-f A-F | sed 's/../&:/g; s/:$//')
          notes="docs/releases/$TAG.md"
          [ -f "$notes" ] || { echo "::error::Missing $notes"; exit 1; }
          {
            cat "$notes"
            printf '\n## Install or update\n\nDownload `%s` below and open it. It installs over the previous version and you stay signed in. The version at the bottom of the app should read v%s.\n' "$apk" "$VERSION"
            printf '\n## Check the file\n\nSHA-256 of `%s`:\n`%s`\n\nSigning certificate (SHA-256):\n`%s`\n' "$apk" "$sum" "$cert"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" "$apk" --title "Pinch $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
